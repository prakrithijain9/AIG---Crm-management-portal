# --- questions that need the newer filters and top-N -----------------------------------

- id: deals_by_industry_filter
  ask: Which deals do we have in the energy industry?
  tools: [list_records]
  expect_text:
    - sql: "select d.title from deals d join companies c on c.id = d.company_id where c.industry = 'Energy'"

- id: top_three_companies
  ask: Top 3 companies by open pipeline value?
  tools: [aggregate]
  expect_text:
    - sql: >-
        select c.name from deals d join companies c on c.id = d.company_id
        where d.stage not in ('Won','Lost') group by c.name order by sum(d.value) desc limit 3

- id: smallest_deal_company
  ask: Which company has our smallest deal?
  tools: [list_records|aggregate]
  expect_text:
    - sql: >-
        select c.name from deals d join companies c on c.id = d.company_id order by d.value limit 1

- id: companies_without_open_deals
  ask: Which companies have no open deals?
  tools: [list_records]
  expect_text:
    - sql: >-
        select name from companies c where not exists (select 1 from deals d where d.company_id = c.id
        and d.stage not in ('Won','Lost'))

- id: companies_gone_quiet
  ask: Which companies have had no activity in the last 30 days?
  tools: [list_records]
  expect_numbers:
    - >-
      select count(*) from companies c where not exists (select 1 from activities a where a.company_id = c.id
      and a.due_date >= cast(:today as date) - 30 and a.due_date <= :today)

# --- follow-ups -------------------------------------------------------------------------

- id: follow_up_pronoun_company
  history:
    - {role: user, content: "Tell me about Helios Energy."}
    - {role: assistant, content: "**Helios Energy** is an Active energy company in Austin, TX."}
  ask: who are their contacts?
  tools: [search]
  expect_text:
    - sql: "select ct.name from contacts ct join companies c on c.id = ct.company_id where c.name = 'Helios Energy'"

- id: follow_up_narrowing
  history:
    - {role: user, content: "How many open deals do we have?"}
    - {role: assistant, content: You have several open deals across your companies.}
  ask: only the ones in negotiation
  tools: [list_records|aggregate]
  expect_numbers: [select count(*) from deals where stage = 'Negotiation']
